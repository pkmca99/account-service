# Jenkins for the account-service CI/CD pipeline, running in Docker Desktop on your laptop.
#
#   cd jenkins
#   docker compose up -d --build                      first start (builds the image, ~5 minutes)
#   docker compose logs jenkins                        shows the initial admin password
#   docker compose down                                stop (jobs and settings are kept in the jenkins_home volume)
#
# Jenkins UI: http://localhost:8090
services:
  jenkins:
    build: .
    image: account-service-jenkins:latest
    container_name: jenkins          # the Jenkinsfile uses this name (--volumes-from jenkins)
    user: root                       # practice setup: lets Jenkins use the Docker Desktop socket
    ports:
      - "8090:8080"                  # 8080 stays free for account-service itself
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
