# gp3 EBS volumes through the EBS CSI driver add-on (the cluster's built-in gp2 class uses the old in-tree driver).
# Retain: deleting a PVC (or uninstalling Jenkins) keeps the EBS volume, so Jenkins home is never lost by accident.
#
#   kubectl apply -f jenkins/k8s/storageclass.yml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: true
