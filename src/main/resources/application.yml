# ----- Application logging -----
# Every line carries the request id (MDC "requestId", set by RequestLoggingFilter), e.g.
#   2026-10-25T18:30:01.123-04:00  INFO 1 --- [account-service] [req=3f2c9a1e-...] [virtual-12] c.e.a.service.AccountService : Deposited 100.00 USD to account 1000000001 (version 1)
#
# Change the app log level without rebuilding: APP_LOG_LEVEL=DEBUG
# JSON logs (for CloudWatch / ELK):  LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs
# Also write a rotating log file:    LOG_FILE=logs/account-service.log
logging:
  level:
    root: TRACE
    com.example.accountservice: ${APP_LOG_LEVEL:TRACE}
    org.springframework.web: TRACE
  pattern:
    correlation: "[req=%X{requestId:-none}] "
  include-application-name: true
  file:
    name: ${LOG_FILE:}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB
