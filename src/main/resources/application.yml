server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never

spring:
  application:
    name: account-service
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

